<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BTC AI 預測系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-b from-slate-100 to-gray-200 min-h-screen flex items-center justify-center p-6">
  <div class="bg-white shadow-xl rounded-2xl w-full max-w-md p-8">
    <h1 class="text-3xl font-extrabold text-center text-blue-700 mb-2">BTC AI 預測系統</h1>
    <p class="text-center text-gray-500 text-sm mb-6">AI 驅動｜支援 Binance 事件合約策略</p>
    <form id="predictForm" class="space-y-4">
      <div class="grid grid-cols-2 gap-4">
        <input type="number" step="0.01" name="open" placeholder="開盤價 (Open)" class="border border-gray-300 p-2 rounded-lg focus:ring-2 focus:ring-blue-400" required>
        <input type="number" step="0.01" name="high" placeholder="最高價 (High)" class="border border-gray-300 p-2 rounded-lg focus:ring-2 focus:ring-blue-400" required>
        <input type="number" step="0.01" name="low" placeholder="最低價 (Low)" class="border border-gray-300 p-2 rounded-lg focus:ring-2 focus:ring-blue-400" required>
        <input type="number" step="0.01" name="close" placeholder="收盤價 (Close)" class="border border-gray-300 p-2 rounded-lg focus:ring-2 focus:ring-blue-400" required>
      </div>
      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-xl transition">立即預測</button>
    </form>
    <div id="result" class="mt-6 hidden text-center">
      <p class="text-sm text-gray-500 mb-1">AI 預測結果：</p>
      <span id="resultText" class="text-2xl font-bold"></span>
    </div>
  </div>
  <script>
    document.getElementById('predictForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = new FormData(e.target);
      const payload = Object.fromEntries(form.entries());
      const res = await fetch('/ai_predict', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          open: parseFloat(payload.open),
          high: parseFloat(payload.high),
          low: parseFloat(payload.low),
          close: parseFloat(payload.close)
        })
      });
      const data = await res.json();
      const el = document.getElementById('result');
      const textEl = document.getElementById('resultText');
      textEl.textContent = data.prediction.toUpperCase();
      textEl.className = `text-2xl font-bold ${
        data.prediction === 'buy' ? 'text-green-600' :
        data.prediction === 'sell' ? 'text-red-600' : 'text-gray-600'
      }`;
      el.classList.remove('hidden');
    });
  </script>
</body>
</html>
