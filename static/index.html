<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BTC AI 預測系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-100 min-h-screen p-6">
  <div class="max-w-3xl mx-auto">
    <h1 class="text-3xl font-bold text-center text-blue-700 mb-4">📊 BTC AI 預測平台</h1>

    <form id="predictForm" class="grid grid-cols-2 md:grid-cols-4 gap-4 bg-white p-4 rounded-xl shadow">
      <input type="number" step="0.01" name="open" placeholder="開盤價 (Open)" class="p-2 border rounded" required>
      <input type="number" step="0.01" name="high" placeholder="最高價 (High)" class="p-2 border rounded" required>
      <input type="number" step="0.01" name="low" placeholder="最低價 (Low)" class="p-2 border rounded" required>
      <input type="number" step="0.01" name="close" placeholder="收盤價 (Close)" class="p-2 border rounded" required>
      <button type="submit" class="col-span-2 md:col-span-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded transition">🚀 執行 AI 預測</button>
    </form>

    <div id="resultBox" class="mt-6 hidden bg-white p-4 rounded-xl shadow text-center">
      <h2 class="text-xl font-bold text-gray-700 mb-2">🔮 AI 預測結果</h2>
      <p id="decision" class="text-2xl font-bold"></p>
      <p id="confidence" class="text-sm text-gray-500"></p>
    </div>

    <div class="mt-8">
      <canvas id="priceChart" height="100"></canvas>
    </div>
  </div>

  <script>
    const form = document.getElementById('predictForm');
    const resultBox = document.getElementById('resultBox');
    const decisionEl = document.getElementById('decision');
    const confidenceEl = document.getElementById('confidence');
    const ctx = document.getElementById('priceChart').getContext('2d');

    let chart;

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(form);
      const data = Object.fromEntries(formData.entries());
      const prices = [data.open, data.high, data.low, data.close].map(Number);

      const res = await fetch('/ai_predict', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          open: prices[0],
          high: prices[1],
          low: prices[2],
          close: prices[3]
        })
      });

      const result = await res.json();
      const label = result.prediction.toUpperCase() === 'BUY' ? '🟢 做多' : result.prediction.toUpperCase() === 'SELL' ? '🔴 做空' : '⚪ 持有';

      decisionEl.textContent = `${label}`;
      decisionEl.className = 'text-2xl font-bold ' + (result.prediction === 'buy' ? 'text-green-600' : result.prediction === 'sell' ? 'text-red-600' : 'text-gray-600');
      confidenceEl.textContent = `信心度：${(result.confidence * 100).toFixed(1)}%`;

      resultBox.classList.remove('hidden');

      if (chart) chart.destroy();
      chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: ['Open', 'High', 'Low', 'Close'],
          datasets: [{
            label: '輸入價格',
            data: prices,
            borderColor: '#3b82f6',
            backgroundColor: 'rgba(59,130,246,0.2)',
            tension: 0.3,
            fill: true
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { display: false }
          },
          scales: {
            y: { beginAtZero: false }
          }
        }
      });
    });
  </script>
</body>
</html>
